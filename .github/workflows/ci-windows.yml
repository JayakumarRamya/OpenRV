name: Pixrock RV Windows

on:
  workflow_dispatch:
    inputs:
      skip_deps_cache:
        type: string
        default: 'false'
      qt5_modules:
        type: string
      full_matrix:
        type: string
        default: 'true'
      run_debug:
        description: >-
          Also build the Debug configuration. Defaults off: it is a second
          ~3 hour job and is not needed for a shippable installer.
        type: string
        default: 'false'
      ui_app_name:
        description: "RV_UI_APPLICATION_NAME - shown in the About box and window titles"
        type: string
        default: 'Pixrock RV'

jobs:

  # ── CY2024 Release ──────────────────────────────────────────────────────────
  windows-pr:
    name: 'Windows ${{ matrix.vfx-platform }}
      <${{ matrix.os }}
       msvc=${{ matrix.msvc-component }},
       qt=${{ matrix.qt-version }},
       python=${{ matrix.python-version }},
       cmake=${{ matrix.cmake-version }},
       arch=${{ matrix.arch-type }},
       config=${{ matrix.build-type }}>'

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "windows-2022"
            arch-type: "x86_64"
            build-type: "Release"
            qt-version: "6.5.3"
            python-version: "3.11"
            cmake-version: "3.31.6"
            vfx-platform: "CY2024"
            msvc-component: "14.40.17.10.x86.x64"
            msvc-compiler: "14.40.33807"

    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: false

    steps:
      - name: Check out repository code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - uses: ./.github/actions/build-windows
        with:
          build-type: ${{ matrix.build-type }}
          qt-version: ${{ matrix.qt-version }}
          python-version: ${{ matrix.python-version }}
          cmake-version: ${{ matrix.cmake-version }}
          vfx-platform: ${{ matrix.vfx-platform }}
          msvc-component: ${{ matrix.msvc-component }}
          msvc-compiler: ${{ matrix.msvc-compiler }}
          qt5_modules: ${{ inputs.qt5_modules }}
          ui-app-name: ${{ inputs.ui_app_name }}
          extra-cmake-flags: >-
            -DOPENEXR_CXX_FLAGS="/O2 /arch:AVX2 /fp:fast /GL"
            -DOPENEXR_ENABLE_THREADING=ON
            -DOPENEXR_BUILD_BOTH_STATIC_SHARED=OFF

      - name: Stage tuning files into _install
        shell: pwsh
        run: |
          $repo = "${{ github.workspace }}"
          $dest = "${{ github.workspace }}\_install"

          # Everything ships under _install\optimize so the artifact is
          # installer-ready: Pixrock_Installer.iss packages {src}\optimize\*
          # wholesale. Previously these landed loose in the artifact root and
          # had to be rearranged by hand before the installer would build.
          New-Item -ItemType Directory -Force -Path "$dest\optimize" | Out-Null
          Copy-Item -Path "$repo\optimize\*" -Destination "$dest\optimize" -Recurse -Force

          Copy-Item -Path "$repo\LICENSE" -Destination "$dest\LICENSE" -Force

          Write-Host "Staged into _install\optimize:"
          Get-ChildItem "$dest\optimize" -Recurse -File |
            ForEach-Object { Write-Host "  $($_.FullName.Substring($dest.Length + 1))" }

      - name: Verify decoders were compiled in
        shell: pwsh
        run: |
          python optimize/probe_decoders.py "${{ github.workspace }}\_install\bin"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: pixrock-rv-windows-${{ matrix.build-type }}
          path: _install


  # ── CY2024 Debug ───────────────────────────────────────────────────────────
  windows-debug:
    if: ${{ inputs.run_debug == 'true' }}

    name: 'Windows ${{ matrix.vfx-platform }}
      <${{ matrix.os }}
       msvc=${{ matrix.msvc-component }},
       qt=${{ matrix.qt-version }},
       python=${{ matrix.python-version }},
       cmake=${{ matrix.cmake-version }},
       arch=${{ matrix.arch-type }},
       config=${{ matrix.build-type }}>'

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "windows-2022"
            arch-type: "x86_64"
            build-type: "Debug"
            qt-version: "6.5.3"
            python-version: "3.11"
            cmake-version: "3.31.6"
            vfx-platform: "CY2024"
            msvc-component: "14.40.17.10.x86.x64"
            msvc-compiler: "14.40.33807"

    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: false

    steps:
      - name: Check out repository code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - uses: ./.github/actions/build-windows
        with:
          build-type: ${{ matrix.build-type }}
          qt-version: ${{ matrix.qt-version }}
          python-version: ${{ matrix.python-version }}
          cmake-version: ${{ matrix.cmake-version }}
          vfx-platform: ${{ matrix.vfx-platform }}
          msvc-component: ${{ matrix.msvc-component }}
          msvc-compiler: ${{ matrix.msvc-compiler }}
          qt5_modules: ${{ inputs.qt5_modules }}
          ui-app-name: ${{ inputs.ui_app_name }}

      - name: Stage tuning files into _install
        shell: pwsh
        run: |
          $repo = "${{ github.workspace }}"
          $dest = "${{ github.workspace }}\_install"

          New-Item -ItemType Directory -Force -Path "$dest\optimize" | Out-Null
          Copy-Item -Path "$repo\optimize\*" -Destination "$dest\optimize" -Recurse -Force
          Copy-Item -Path "$repo\LICENSE" -Destination "$dest\LICENSE" -Force

          Write-Host "Staging complete"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: pixrock-rv-windows-${{ matrix.build-type }}
          path: _install
