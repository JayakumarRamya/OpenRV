name: OpenRV Windows

on:
  workflow_dispatch:
    inputs:
      skip_deps_cache:
        type: string
        default: 'false'
      qt5_modules:
        type: string
      full_matrix:
        type: string
        default: 'true'
      run_debug:
        type: string
        default: 'true'

jobs:

  # ── CY2024 Release ──────────────────────────────────────────────────────────
  windows-pr:
    name: 'Windows ${{ matrix.vfx-platform }}
      <${{ matrix.os }}
       msvc=${{ matrix.msvc-component }},
       qt=${{ matrix.qt-version }},
       python=${{ matrix.python-version }},
       cmake=${{ matrix.cmake-version }},
       arch=${{ matrix.arch-type }},
       config=${{ matrix.build-type }}>'

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "windows-2022"
            arch-type: "x86_64"
            build-type: "Release"
            qt-version: "6.5.3"
            python-version: "3.11"
            cmake-version: "3.31.6"
            vfx-platform: "CY2024"
            msvc-component: "14.40.17.10.x86.x64"
            msvc-compiler: "14.40.33807"

    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: false

    steps:
      - name: Check out repository code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - uses: ./.github/actions/build-windows
        with:
          build-type: ${{ matrix.build-type }}
          qt-version: ${{ matrix.qt-version }}
          python-version: ${{ matrix.python-version }}
          cmake-version: ${{ matrix.cmake-version }}
          vfx-platform: ${{ matrix.vfx-platform }}
          msvc-component: ${{ matrix.msvc-component }}
          msvc-compiler: ${{ matrix.msvc-compiler }}
          qt5_modules: ${{ inputs.qt5_modules }}
          extra-cmake-flags: >-
            -DOPENEXR_CXX_FLAGS="/O2 /arch:AVX2 /fp:fast /GL"
            -DOPENEXR_ENABLE_THREADING=ON
            -DOPENEXR_BUILD_BOTH_STATIC_SHARED=OFF

      - name: Stage rv_prefs files into _install
        shell: pwsh
        run: |
          $dest = "${{ github.workspace }}\_install"
          Copy-Item -Path "${{ github.workspace }}\rv_prefs_NVIDIA_RTX3060"    -Destination "$dest\rv_prefs_NVIDIA_RTX3060"    -Force
          Copy-Item -Path "${{ github.workspace }}\rv_prefs_AMD_RX5700"        -Destination "$dest\rv_prefs_AMD_RX5700"        -Force
          Copy-Item -Path "${{ github.workspace }}\rv_prefs_IntelUHD770_noGPU" -Destination "$dest\rv_prefs_IntelUHD770_noGPU" -Force
          Copy-Item -Path "${{ github.workspace }}\Install-RVPrefs.ps1"        -Destination "$dest\Install-RVPrefs.ps1"        -Force
          Copy-Item -Path "${{ github.workspace }}\rv_cache_prewarm.mu"        -Destination "$dest\rv_cache_prewarm.mu"        -Force
          Write-Host "All rv_prefs and prewarm script staged into _install"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: openrv-windows-${{ matrix.build-type }}
          path: _install


  # ── CY2024 Debug ───────────────────────────────────────────────────────────
  windows-debug:
    if: ${{ inputs.run_debug == 'true' }}

    name: 'Windows ${{ matrix.vfx-platform }}
      <${{ matrix.os }}
       msvc=${{ matrix.msvc-component }},
       qt=${{ matrix.qt-version }},
       python=${{ matrix.python-version }},
       cmake=${{ matrix.cmake-version }},
       arch=${{ matrix.arch-type }},
       config=${{ matrix.build-type }}>'

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "windows-2022"
            arch-type: "x86_64"
            build-type: "Debug"
            qt-version: "6.5.3"
            python-version: "3.11"
            cmake-version: "3.31.6"
            vfx-platform: "CY2024"
            msvc-component: "14.40.17.10.x86.x64"
            msvc-compiler: "14.40.33807"

    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: false

    steps:
      - name: Check out repository code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - uses: ./.github/actions/build-windows
        with:
          build-type: ${{ matrix.build-type }}
          qt-version: ${{ matrix.qt-version }}
          python-version: ${{ matrix.python-version }}
          cmake-version: ${{ matrix.cmake-version }}
          vfx-platform: ${{ matrix.vfx-platform }}
          msvc-component: ${{ matrix.msvc-component }}
          msvc-compiler: ${{ matrix.msvc-compiler }}
          qt5_modules: ${{ inputs.qt5_modules }}
          # Debug — no AVX2 flags, keep debug symbols clean

      - name: Stage rv_prefs files into _install
        shell: pwsh
        run: |
          $dest = "${{ github.workspace }}\_install"
          Copy-Item -Path "${{ github.workspace }}\rv_prefs_NVIDIA_RTX3060"    -Destination "$dest\rv_prefs_NVIDIA_RTX3060"    -Force
          Copy-Item -Path "${{ github.workspace }}\rv_prefs_AMD_RX5700"        -Destination "$dest\rv_prefs_AMD_RX5700"        -Force
          Copy-Item -Path "${{ github.workspace }}\rv_prefs_IntelUHD770_noGPU" -Destination "$dest\rv_prefs_IntelUHD770_noGPU" -Force
          Copy-Item -Path "${{ github.workspace }}\Install-RVPrefs.ps1"        -Destination "$dest\Install-RVPrefs.ps1"        -Force
          Copy-Item -Path "${{ github.workspace }}\rv_cache_prewarm.mu"        -Destination "$dest\rv_cache_prewarm.mu"        -Force
          Write-Host "All rv_prefs and prewarm script staged into _install"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: openrv-windows-${{ matrix.build-type }}
          path: _install
